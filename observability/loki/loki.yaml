# OBS-02 Loki: structured log store via native OTLP HTTP ingestion.
# 72h log retention (PRD 44.7). allow_structured_metadata is required
# for OTLP trace-correlation metadata (trace_id/span_id stay structured
# metadata, not index labels, per PRD 44.7).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 72h
  reject_old_samples: false
  allow_structured_metadata: true
  max_global_streams_per_user: 5000

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

analytics:
  reporting_enabled: false
