[workspace]
members = ["crates/fluzo-core", "crates/fluzo-runtime", "crates/fluzo-tui", "crates/fluzo-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/fluzo-labs/fluzo"
publish = false

[workspace.dependencies]
fluzo-core = { path = "crates/fluzo-core" }
fluzo-runtime = { path = "crates/fluzo-runtime" }
fluzo-tui = { path = "crates/fluzo-tui" }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
