[package]
name = "fluzo-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fluzo-core.workspace = true
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.28.1", default-features = false, features = ["events", "bracketed-paste"] }
unicode-segmentation = { version = "=1.13.3", default-features = false }
unicode-width = { version = "=0.2.0", default-features = false }
signal-hook = { version = "=0.3.18", default-features = false }
